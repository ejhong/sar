[project]
name = "katabasis"
version = "0.1.0"
description = "Simulation lab for imaging the underworld: seismic tomography and SAR, simulated and applied."
requires-python = ">=3.11,<3.14"
authors = [{ name = "Eugene Jhong" }]
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "numba>=0.60",
    "scikit-fmm>=2024.5",
    "matplotlib>=3.9",
    "pillow>=10",
    "h5py>=3.11",
    "tifffile>=2024.1",
    "scikit-image>=0.25",
    "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["katabasis", "sarsim"]

[tool.pytest.ini_options]
testpaths = ["tests", "legacy/tests"]
pythonpath = ["legacy"]
addopts = "-q"
